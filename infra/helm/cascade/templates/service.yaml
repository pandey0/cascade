apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  selector: { app: cascade-gateway }
  ports: [{ port: {{ .Values.service.port }}, targetPort: 8080 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: cascade-gateway }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  podSelector:
    matchLabels: { app: cascade-gateway }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8080 }]   # restrict `from:` to your ingress/monitoring namespaces before use
