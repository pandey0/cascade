name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev,anthropic,gemini]"
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: mypy
      - run: pytest --cov --cov-report=xml
      - run: cascade exp0 --trials 50 --m 300 --out results/ci
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" && pip-audit
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cascade:ci .
      - run: docker run --rm cascade:ci cascade version
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[gateway]" && python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
      - name: promtool
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/p" --entrypoint promtool prom/prometheus:v2.55.1 check rules /p/alerts.yml
      - uses: hashicorp/setup-terraform@v3
      - run: cd infra/terraform && terraform init -backend=false && terraform fmt -check && terraform validate
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/cascade
  trivy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cascade:ci .
      - name: Trivy scan (OS + Python packages)
        run: |
          docker save cascade:ci -o cascade.tar
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.58.1 image --input /w/cascade.tar --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln --exit-code 1
