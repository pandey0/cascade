name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write   # create the GitHub release
  packages: write   # push to GHCR
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,anthropic,gemini]" && ruff check src tests scripts && mypy && pytest -m "not slow"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: docker build -t ghcr.io/${{ github.repository }}/gateway:${{ github.ref_name }} .
      - name: Trivy scan (OS + Python packages)
        run: |
          docker save ghcr.io/${{ github.repository }}/gateway:${{ github.ref_name }} -o cascade.tar
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.58.1 image --input /w/cascade.tar --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln --exit-code 1
          image-ref: ghcr.io/${{ github.repository }}/gateway:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - run: docker push ghcr.io/${{ github.repository }}/gateway:${{ github.ref_name }}
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with: { body_path: notes.md }
# Staging deploy and rollback: see infra/README.md and docs/runbook.md. Roll back by redeploying the
# previous tag (immutable ECR/GHCR tags); the audit DB is versioned, restore the pre-upgrade backup.
