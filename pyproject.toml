[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cascade-llm"
version = "0.1.0"
description = "Certified cost-quality decision cascades: cheap model first, escalate to a teacher when unsure, with statistical agreement guarantees."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Arpit Pandey" }]
keywords = ["llm", "cascade", "selective-classification", "conformal", "calibration", "cost"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gateway = ["fastapi>=0.110", "uvicorn>=0.54.0", "prometheus-client>=0.20"]
jev = ["typesafe-sdk>=0.7"]
bench = ["datasets>=2.19", "sentence-transformers>=3.0"]
figures = ["matplotlib>=3.8"]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=2.0"]
embed = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27",
  "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "scipy-stubs", "pip-audit>=2.7",
  "fastapi>=0.110", "uvicorn>=0.54.0", "prometheus-client>=0.20", "typesafe-sdk>=0.7",
]

[project.scripts]
cascade = "cascade.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "S"]
ignore = ["PLR2004", "S101", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "typesafe_sdk.*", "datasets.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: statistical simulation tests"]

[tool.coverage.run]
source = ["src/cascade"]
[tool.coverage.report]
fail_under = 85
show_missing = true
